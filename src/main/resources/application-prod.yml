spring:
  datasource:
    url: ${DB_SOURCE}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update # 배포 초기에는 update로 테이블을 자동 생성하고, 나중에는 validate나 none으로 바꾸는 것이 안전
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

app:
  frontend:
    base-url: ${FRONTEND_BASE_URL}
